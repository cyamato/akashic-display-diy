; Akashic Display sensor node: door counter, air quality and a GraphQL endpoint.
; Two boards: an ESP32-S3 on Wi-Fi, or an Olimex ESP32-POE-ISO on PoE Ethernet.
;   pio run -e esp32-s3 -t upload        (or -e esp32-poe-iso)
;   pio device monitor
; Copy include/node_config.example.h to include/node_config.h and fill it in first.

[platformio]
default_envs = esp32-s3, esp32-poe-iso

[env]
; Arduino-ESP32 2.0.x (ESP-IDF 4.4).
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
; No over-the-air updates (flash it by USB), so the app may use most of the flash.
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -DFIRMWARE_VERSION=\"0.1.0\"
lib_deps =
  sparkfun/SparkFun VL53L5CX Arduino Library@^1.0.3
  sensirion/Sensirion I2C SCD4x@~0.4.0
  sensirion/Sensirion I2C SHT4x@~0.1.0
  adafruit/Adafruit TSL2591 Library@^1.4.5

; ESP32-S3-DevKitC-1 on Wi-Fi. I2C on 8/9, the PMS5003 on UART1 (its TX to 18), the
; time-of-flight sensors' LPn pins on 4 and 5.
[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -DNET_WIFI=1
  -DPIN_SDA=8
  -DPIN_SCL=9
  -DPIN_PMS_RX=18
  -DPIN_PMS_TX=17
  -DPIN_TOF_A_LPN=4
  -DPIN_TOF_B_LPN=5

; Olimex ESP32-POE-ISO on PoE Ethernet (LAN8720). I2C on the UEXT connector (SDA 13,
; SCL 16), the PMS5003 on UEXT's UART (its TX to GPIO 36, input only), LPn on 32 and 33.
[env:esp32-poe-iso]
board = esp32-poe-iso
build_flags =
  ${env.build_flags}
  -DNET_ETHERNET=1
  -DPIN_SDA=13
  -DPIN_SCL=16
  -DPIN_PMS_RX=36
  -DPIN_PMS_TX=4
  -DPIN_TOF_A_LPN=32
  -DPIN_TOF_B_LPN=33
